services:
  neo4j:
    image: neo4j:5-community
    container_name: zhinu-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/zhinu-dev-password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - zhinu-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  zhinu-neo4j-data:
